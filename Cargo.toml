[package]
name = "timetracker"
version = "0.8.0"
edition = "2024"
repository = "https://github.com/linus-skold/timetracker-rs"

[[bin]]
name = "tt"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = { version = "4", features = ["unstable-dynamic"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
# `preserve_order`: an entry's custom data keeps the order it was written in,
# rather than being sorted alphabetically on the way to the detail view.
serde_json = { version = "1", features = ["preserve_order"] }
directories = "5"
anyhow = "1"
toml = "0.8"
ratatui = "0.29"
crossterm = "0.28"
self_update = { version = "0.44", default-features = false, features = ["reqwest", "rustls"] }
semver = "1"
