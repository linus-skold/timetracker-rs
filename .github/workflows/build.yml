name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Formatting, lints and the test suite. Ubuntu alone: `build` below already
  # covers cross-platform compilation, and none of these three checks is
  # platform-dependent. Runs on every PR and every push to main, including the
  # pushes that skip `build` entirely, so nothing reaches main unchecked.
  #
  # `-D warnings` is deliberate: clippy findings accumulate precisely because
  # nothing rejects them, and every later refactor then has to work around the
  # noise. --all-targets so the lint covers tests/ too, not just the binary.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      # The integration tests under tests/ shell out to the compiled `tt`
      # binary, so they need it built first; `cargo test` does that itself.
      - name: Test
        run: cargo test

  # On a push to main (not a tag, not a PR), checks whether Cargo.toml's
  # version already has a matching tag. If not, this *is* the release: it
  # tags it here, in this same run, rather than pushing the tag and hoping a
  # fresh workflow run picks it up — a tag pushed with the default
  # `GITHUB_TOKEN` deliberately does not trigger other workflow runs (GitHub's
  # anti-loop protection), so `build`/`flatpak`/`release` below key off this
  # job's `is_new_release` output instead of waiting on that second trigger.
  tag:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      is_new_release: ${{ steps.check.outputs.is_new_release }}
    steps:
      - uses: actions/checkout@v4

      - name: Check Cargo.toml version against existing tags
        id: check
        run: |
          version=$(grep -m1 '^version' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git ls-remote --tags origin | grep -q "refs/tags/$tag\$"; then
            echo "$tag already exists, not a new release."
            echo "is_new_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "$tag is new."
            echo "is_new_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push the tag
        if: steps.check.outputs.is_new_release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.check.outputs.tag }}" -m "Release ${{ steps.check.outputs.tag }}"
          git push origin "${{ steps.check.outputs.tag }}"

  # Runs for a real `v*` tag push (manual tagging), a pull request (build
  # validation only — `flatpak`/`release` below still won't run for it), or
  # when `tag` just cut a new version in this same run. A plain push to main
  # with no version bump does none of these and skips the build entirely —
  # that's the redundant case being removed.
  build:
    needs: tag
    if: |
      always() && needs.tag.result != 'failure' && (
        startsWith(github.ref, 'refs/tags/v') ||
        github.event_name == 'pull_request' ||
        needs.tag.outputs.is_new_release == 'true'
      )
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: tt
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: tt.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: tt
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: tt

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      # Renamed to embed the target triple, which `self_update` (see
      # `src/update.rs`) matches release assets against by substring — the
      # bare `tt`/`tt.exe` the build produces would collide across platforms
      # once uploaded to the same GitHub Release.
      - name: Rename binary for release
        shell: bash
        run: |
          mkdir -p dist
          src="target/${{ matrix.target }}/release/${{ matrix.artifact }}"
          dest="dist/tt-${{ matrix.target }}"
          if [[ "${{ matrix.artifact }}" == *.exe ]]; then dest="$dest.exe"; fi
          cp "$src" "$dest"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tt-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # Wraps the already-built Linux binary from `build` in a redistributable
  # `.flatpak` bundle — it does not build Rust inside the sandbox, so no Rust
  # SDK extension or cargo dependency vendoring is needed. Not submitted to
  # Flathub; this is just a downloadable bundle attached to the Release.
  #
  # Runs for a real `v*` tag push (manual tagging still works) or when `tag`
  # just cut a new one in this same run — `always()` because a skipped `tag`
  # job (the manual-tag path) would otherwise skip this too by default. Never
  # runs for a pull request: `build` may have run there, but neither trigger
  # condition below is true for a PR.
  flatpak:
    needs: [build, tag]
    runs-on: ubuntu-latest
    if: always() && needs.build.result == 'success' && (startsWith(github.ref, 'refs/tags/v') || needs.tag.outputs.is_new_release == 'true')
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux binary
        uses: actions/download-artifact@v4
        with:
          name: tt-x86_64-unknown-linux-gnu
          path: dist

      - name: Install flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Platform//23.08 org.freedesktop.Sdk//23.08

      - name: Build Flatpak bundle
        run: |
          chmod +x dist/tt-x86_64-unknown-linux-gnu
          cp dist/tt-x86_64-unknown-linux-gnu flatpak/tt-x86_64-unknown-linux-gnu
          flatpak-builder --user --force-clean --repo=repo build-dir \
            flatpak/io.github.linus_skold.tt.yml
          flatpak build-bundle repo tt-x86_64-unknown-linux-gnu.flatpak \
            io.github.linus_skold.tt

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v4
        with:
          name: tt-x86_64-unknown-linux-gnu-flatpak
          path: tt-x86_64-unknown-linux-gnu.flatpak
          if-no-files-found: error

  # Publishes everything `build`/`flatpak` produced as a real GitHub Release —
  # what `tt update` (src/update.rs) and the startup check look for. Same
  # trigger logic as `flatpak`: a real tag push, or `tag` cutting a new one
  # just now.
  release:
    needs: [build, flatpak, tag]
    runs-on: ubuntu-latest
    if: always() && needs.build.result == 'success' && needs.flatpak.result == 'success' && (startsWith(github.ref, 'refs/tags/v') || needs.tag.outputs.is_new_release == 'true')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.tag || github.ref_name }}
          files: dist/**/*
